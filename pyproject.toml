[project]
name = "merge-utils"
description = "Utilities for merging DUNE data"
readme = "README.md"
authors = [
  { name="Ethan Muldoon", email="muldoone@oregonstate.edu" },
  { name="Heidi Schellman", email="heidi.schellman@oregonstate.edu" },
]
dependencies = [
  "pyyaml",
  "tomli",
]
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]
dynamic = ["version"]

[project.optional-dependencies]
standalone = [
  "metacat-client",
  "rucio-clients",
  "htgettoken",
  "h5py",
]
test = ["pytest"]

[dependency-groups]
dev = [
  "pytest",
  "metacat-client",
  "rucio-clients",
  "htgettoken",
  "h5py",
]

[project.urls]
"Homepage" = "https://DUNE.github.io/merge-utils"
"Source Code" = "https://github.com/DUNE/merge-utils"

[project.scripts]
merge = "merge_utils.__main__:main"
provenance = "utilities.provenance:main"
validate = "merge_utils.__main__:validate_inputs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch]
version.path = "src/merge_utils/__init__.py"